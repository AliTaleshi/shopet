# Login codes: at most 60 requests per minute per IP (bursts of 30), against SMS flooding and code guessing.
limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/auth/ {
        limit_req zone=auth burst=30 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many_requests;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location @too_many_requests {
        default_type application/json;
        return 429 '{"status":429,"detail":"تعداد درخواست‌ها زیاد است؛ کمی بعد دوباره تلاش کنید."}';
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths are handled by the client router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
